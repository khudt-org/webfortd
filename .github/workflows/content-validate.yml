name: Content Validate

# webfortd Phase 1 M5 — PR 기반 콘텐츠 검수 자동화.
#
# 흐름:
#   1. 의존성 설치 → 2. validate:content → 3. sync:content
#   4. PR 이벤트면 alt_text 라벨링 + MDX escape 경고 수집
#   5. PR 코멘트 게시 (위키링크 broken + 경고 통합)
#   6. validate/sync 실패 시 전체 워크플로 fail
#
# Idempotency: PR 코멘트는 <!-- webfortd-content-validate --> 마커로
# 기존 봇 코멘트를 찾아 update — 재실행마다 새 코멘트 쌓이지 않음.
#
# 보안: pull_request 트리거(pull_request_target 금지) + 최소 permissions만 부여.
# GITHUB_TOKEN은 자동 주입되며 별도 secret 불요.

on:
  # PR #12 후속 — paths 필터 제거.
  # 이전 설계: content/* 또는 검증 스크립트 변경 시만 workflow 실행 (최소 CI 비용).
  # 문제: branch protection이 `validate` job을 모든 PR에 required로 요구하므로
  # paths에 매칭되지 않는 PR(예: src/app/* 변경)에서 workflow 자체가 실행되지 않아
  # required check가 영원히 missing → merge 영구 차단(admin 우회 필요).
  # 해결: paths 제거. 모든 PR·push에서 workflow 실행. content 변경 없으면
  # validate:content / sync:content가 빠르게 PASS 처리되어 required check 충족.
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: content-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # PR diff 분석(check-alt-text-labels, check-mdx-escape)에 origin/<base> 필요
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate frontmatter
        id: validate
        run: npm run validate:content
        continue-on-error: true

      - name: Sync content index
        id: sync
        run: npm run sync:content
        continue-on-error: true

      # coderabbit P1 #4: 두 check 스크립트는 항상 exit 0(warning-only) 보장이라
      # continue-on-error 불필요. 옵션 제거로 실수로 비-zero exit 들어가면 즉시 fail.
      - name: Check alt_text labels (PR only)
        if: github.event_name == 'pull_request'
        id: alt_text
        run: npm run check:alt-text

      - name: Check MDX escape integrity (PR only)
        if: github.event_name == 'pull_request'
        id: mdx_escape
        run: npm run check:mdx-escape

      - name: Post PR comment (PR only, non-fork)
        # codex-rescue M5 P1 #1: fork PR은 GITHUB_TOKEN이 read-only로 강등될 수 있어
        # write API 호출이 워크플로 실패로 번질 위험. fork PR은 코멘트/라벨 단계 자체를 스킵.
        # 운영 단계에서 fork PR 검수 필요해지면 별도 pull_request_target 기반 워크플로 신설.
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const { readFileSync, existsSync } = await import('node:fs');
            const BOT_MARKER = '<!-- webfortd-content-validate -->';

            // 1. 위키링크 broken 추출
            let broken = [];
            try {
              const idx = JSON.parse(readFileSync('src/lib/kb-index.generated.json', 'utf-8'));
              broken = Array.isArray(idx.broken_wikilinks) ? idx.broken_wikilinks : [];
            } catch (e) {
              core.warning(`kb-index.generated.json 읽기 실패: ${e.message}`);
            }

            // 2. MDX escape 경고
            let mdxIssues = [];
            try {
              if (existsSync('/tmp/mdx-escape-issues.json')) {
                mdxIssues = JSON.parse(readFileSync('/tmp/mdx-escape-issues.json', 'utf-8'));
              }
            } catch (e) {
              core.warning(`mdx-escape-issues.json 읽기 실패: ${e.message}`);
            }

            // 3. alt_text 미완성
            let altSlugs = [];
            try {
              if (existsSync('/tmp/alt-text-incomplete.flag')) {
                altSlugs = readFileSync('/tmp/alt-text-incomplete.flag', 'utf-8')
                  .trim().split('\n').filter(Boolean);
              }
            } catch (e) {
              core.warning(`alt-text flag 읽기 실패: ${e.message}`);
            }

            // 4. 코멘트 본문 조립
            const validateOk = '${{ steps.validate.outcome }}' === 'success';
            const syncOk = '${{ steps.sync.outcome }}' === 'success';

            const lines = [BOT_MARKER, ''];
            lines.push('## 콘텐츠 검증 결과');
            lines.push('');
            lines.push(`- frontmatter validate: ${validateOk ? '통과' : '실패'}`);
            lines.push(`- sync(인덱스 빌드): ${syncOk ? '통과' : '실패'}`);
            // codex-rescue M5 P1 #2: sync 실패 시 broken_wikilinks 결과는 stale 또는 부재이므로
            // "0건"으로 권위적으로 표시하면 안 됨. syncOk=false면 확인 불가로 분기.
            const brokenLine = syncOk
              ? `- 끊긴 위키링크: ${broken.length}건`
              : `- 끊긴 위키링크: 확인 불가 (sync 실패로 인덱스가 stale일 수 있음)`;
            lines.push(brokenLine);
            lines.push(`- alt_text 미완성(변경 파일 한정): ${altSlugs.length}건`);
            lines.push(`- MDX escape 경고: ${mdxIssues.length}건`);
            lines.push('');

            // syncOk=false면 broken_wikilinks 상세 섹션은 신뢰 불가하므로 표시 안 함.
            if (syncOk && broken.length > 0) {
              lines.push('### 끊긴 위키링크');
              lines.push('');
              lines.push('| 출처 | 대상 슬러그 | 라인 |');
              lines.push('|------|-----------|------|');
              for (const b of broken.slice(0, 50)) {
                lines.push(`| \`${b.source}\` | \`${b.target}\` | ${b.line} |`);
              }
              if (broken.length > 50) {
                lines.push('');
                lines.push(`> 외 ${broken.length - 50}건 생략. 전체 목록은 빌드 아티팩트 \`src/lib/kb-index.generated.json\` 참조.`);
              }
              lines.push('');
            }

            if (altSlugs.length > 0) {
              lines.push('### alt_text 미완성 페이지 (변경된 파일 한정)');
              lines.push('');
              for (const s of altSlugs.slice(0, 30)) {
                lines.push(`- \`${s}\``);
              }
              if (altSlugs.length > 30) {
                lines.push(`- 외 ${altSlugs.length - 30}건 생략`);
              }
              lines.push('');
              // codex-rescue M5 P0: 자동 라벨은 "검수 필요"를 의미하므로 needs:accessibility-review.
              // reviewed:* 라벨은 위원장이 검수 완료 후 수동 부착.
              lines.push('자동으로 `needs:accessibility-review` 라벨이 부착됐습니다(라벨이 사전 생성된 경우).');
              lines.push('');
            }

            if (mdxIssues.length > 0) {
              lines.push('### MDX escape 경고 (warning-only)');
              lines.push('');
              lines.push('본문에 KbPageLayout이 escape하는 패턴이 발견됐습니다. 렌더 결과를 직접 확인하세요.');
              lines.push('');
              lines.push('| 파일 | 라인(본문 기준) | 패턴 | snippet |');
              lines.push('|------|---------------|------|---------|');
              for (const issue of mdxIssues.slice(0, 20)) {
                const snippet = (issue.snippet || '').replace(/\|/g, '\\|').slice(0, 60);
                lines.push(`| \`${issue.file}\` | ${issue.line} | ${issue.pattern} | \`${snippet}\` |`);
              }
              if (mdxIssues.length > 20) {
                lines.push('');
                lines.push(`> 외 ${mdxIssues.length - 20}건 생략. 전체 목록은 워크플로 로그의 \`/tmp/mdx-escape-issues.json\` 참조.`);
              }
              lines.push('');
            }

            if (
              validateOk &&
              syncOk &&
              broken.length === 0 &&
              mdxIssues.length === 0 &&
              altSlugs.length === 0
            ) {
              lines.push('모든 검사 통과. 검수 준비 완료.');
            }

            const body = lines.join('\n');

            // 5. upsert (BOT_MARKER로 기존 코멘트 찾아 update)
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.data.find((c) =>
              c.body && c.body.includes(BOT_MARKER)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`PR 코멘트 갱신: #${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info('PR 코멘트 신규 생성');
            }

      - name: Apply needs:accessibility-review label (PR only, non-fork)
        # codex-rescue M5 P0: 자동 라벨 이름을 needs:accessibility-review로 변경.
        # reviewed:* 라벨은 위원장이 검수 완료 후 수동 부착하는 의미라
        # alt_text 미완성 페이지에 reviewed:accessibility를 자동 부착하면 의미 충돌.
        # codex-rescue M5 P1 #1: fork PR 보안 조건도 함께 적용.
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const { readFileSync, existsSync } = await import('node:fs');
            if (!existsSync('/tmp/alt-text-incomplete.flag')) {
              core.info('alt_text 미완성 없음 — 라벨 미부착');
              return;
            }
            const slugs = readFileSync('/tmp/alt-text-incomplete.flag', 'utf-8').trim();
            if (!slugs) {
              core.info('alt_text flag 비어있음 — 라벨 미부착');
              return;
            }
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['needs:accessibility-review'],
              });
              core.info('needs:accessibility-review 라벨 부착');
            } catch (e) {
              // 라벨이 사전 생성돼 있지 않거나 권한 부족(fork PR)이면 실패할 수 있음 — warning으로만 처리.
              core.warning(`라벨 부착 실패(라벨 사전 생성 또는 권한 확인 필요): ${e.message}`);
            }

      - name: Finalize
        # validate 또는 sync가 실패했으면 워크플로 자체를 실패로 마킹.
        # alt_text/mdx_escape는 warning-only라 finalize에 영향 없음.
        if: steps.validate.outcome == 'failure' || steps.sync.outcome == 'failure'
        run: |
          echo "validate=${{ steps.validate.outcome }} sync=${{ steps.sync.outcome }}"
          exit 1
