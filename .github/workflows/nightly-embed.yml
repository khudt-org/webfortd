name: nightly-embed

# webfortd: 야간 kb:sync + kb:embed 자동화 (spec: docs/superpowers/specs/2026-08-04-web-content-editor-design.md §5, §11-3, §11-6).
#
# 트리거 기준은 날짜가 아니라 content/ 디렉터리 SHA다. 마지막 성공 실행이 repo variable
# LAST_EMBED_SHA에 기록한 SHA와 현재 브랜치의 content/ SHA가 같으면 건너뛴다. 실패 시
# LAST_EMBED_SHA를 갱신하지 않으므로 다음 실행이 자동 재시도한다(§11-6 런북과 별개의
# 자동 회복 경로). kb:sync → kb:embed는 같은 job 안에서 직렬 실행해 writer 경쟁을 원천 차단한다.
#
# env 변수명은 scripts/lib/env-loader.ts · scripts/sync-content-to-db.ts ·
# scripts/embed-content.ts · scripts/lib/gemini-embed.ts의 실계약을 그대로 따른다
# (NEXT_PUBLIC_SUPABASE_URL · SUPABASE_SECRET_KEY · GOOGLE_GENERATIVE_AI_API_KEY.
# spec §11-3의 통칭 "SUPABASE_URL"·"service_role 키"·"GEMINI_API_KEY"와 문자열이 다르므로
# Secrets 등록 시 반드시 아래 이름 그대로 사용할 것). 두 스크립트 모두 --apply 플래그는
# 없다. 인자 없이 호출하면 실 반영(kb:sync/kb:embed와 동일), --dry-run을 줘야 건너뛴다.

on:
  schedule:
    - cron: '0 18 * * *' # KST 03:00
  workflow_dispatch: # 수동 재처리 경로(spec §11-6)
    inputs:
      allow_mass_delete:
        description: 'DB 과반이 고아(주소 체계 전환 직후)여도 정리 진행 — .embed-paused 해제 첫 실행에만'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-embed
  cancel-in-progress: false

jobs:
  sync-and-embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: content 변경 확인 (마지막 성공 SHA 대비 · 일시정지 파일)
        id: gate
        run: |
          CURRENT=$(git log -1 --format=%H -- content/)
          LAST="${{ vars.LAST_EMBED_SHA }}"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          # content/.embed-paused 가 있으면 sync·embed를 하지 않는다(SHA도 기록하지 않아
          # 파일을 지운 다음 실행이 밀린 변경을 그대로 따라잡는다). 3층 재생성처럼 주소 체계가
          # 바뀌어 DB 행이 고아가 되고 임베딩 전량 재생성(유료)이 걸리는 기간에 쓴다.
          if [ -f content/.embed-paused ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::content/.embed-paused 존재 — kb:sync·kb:embed 건너뜀"
          elif [ "$CURRENT" = "$LAST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.gate.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - name: 의존성 설치 + 인덱스 생성
        if: steps.gate.outputs.skip == 'false'
        run: |
          npm ci
          npm run sync:content

      - name: kb:sync + kb:embed (실 반영, 두 스크립트 모두 인자 없으면 apply 모드)
        if: steps.gate.outputs.skip == 'false'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: |
          npx tsx scripts/sync-content-to-db.ts ${{ inputs.allow_mass_delete && '--allow-mass-delete' || '' }}
          npx tsx scripts/embed-content.ts

      - name: 성공 SHA 기록 (실패 시 미기록 → 다음 실행이 자동 재시도)
        if: steps.gate.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.VAR_RW_TOKEN }}
        run: gh variable set LAST_EMBED_SHA --body "${{ steps.gate.outputs.current }}" --repo "$GITHUB_REPOSITORY"
